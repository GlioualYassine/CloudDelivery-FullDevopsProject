version: "3.9"

services:
  # =========================
  # PostgreSQL (Orders / Deliveries / Payments)
  # =========================
  postgres:
    image: postgres:15
    container_name: clouddelivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cld_user
      POSTGRES_PASSWORD: cld_password
      POSTGRES_DB: cld_main_db   # DB par défaut ; tu peux en créer d'autres via migrations
    ports:
      - "5432:5432"              # accès depuis IntelliJ
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clouddelivery-net

  # =========================
  # MongoDB (Auth / Notifications)
  # =========================
  mongodb:
    image: mongo:6.0
    container_name: clouddelivery-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_root
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: auth_db
    ports:
      - "27017:27017"            # accès depuis IntelliJ
    volumes:
      - mongo_data:/data/db
    networks:
      - clouddelivery-net

  # =========================
  # Zookeeper (pour Kafka)
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: clouddelivery-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - clouddelivery-net

  # =========================
  # Kafka
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: clouddelivery-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # accès depuis ta machine: localhost:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listener unique pour dev : accessible sur localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Un seul broker → facteur de réplication = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - clouddelivery-net

networks:
  clouddelivery-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
