spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app.security.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-signing
app.security.jwt.expiration=3600000
app.security.jwt.refresh-expiration=2592000000
app.security.password-reset.expiration-minutes=15
app.kafka.password-reset-topic=password-reset-requests
